# TensorRT-LLM 1.3.0rc17 native PyTorch backend for RTX Blackwell SM120.
# CUTEDSL resolves to the hybrid CUTLASS-prefill / FlashInfer B12x decode MoE
# for NVFP4; BF16 and per-tensor FP8 fall back explicitly to CUTLASS.
max_batch_size: 32
max_num_tokens: 2048
max_seq_len: 8192
enable_chunked_prefill: true
cuda_graph_config:
  batch_sizes: [1]
  enable_padding: true
kv_cache_config:
  dtype: auto
  free_gpu_memory_fraction: 0.82
  enable_block_reuse: false
moe_config:
  backend: CUTEDSL
