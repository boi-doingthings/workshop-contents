# Derived from TensorRT-LLM v1.3.0rc17
# examples/auto_deploy/model_registry/configs/nano_v3.yaml.
max_batch_size: 32
max_seq_len: 8192
enable_chunked_prefill: true
attn_backend: trtllm
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 32]
kv_cache_config:
  free_gpu_memory_fraction: 0.82
  enable_block_reuse: false
  enable_partial_reuse: false
transforms:
  detect_sharding:
    allreduce_strategy: SYMM_MEM
    sharding_dims: ['ep', 'bmm']
    sharding_source: ['manual']
    manual_config:
      head_dim: 128
      tp_plan:
        "in_proj": "mamba"
        "out_proj": "rowwise"
        "q_proj": "colwise"
        "k_proj": "colwise"
        "v_proj": "colwise"
        "o_proj": "rowwise"
        "up_proj": "colwise"
        "down_proj": "rowwise"
        "fc1_latent_proj": "gather"
        "fc2_latent_proj": "gather"
  multi_stream_moe:
    enabled: true
  gather_logits_before_lm_head:
    enabled: true
  fuse_mamba_a_log:
    stage: post_load_fusion
    enabled: true
  insert_cached_ssm_attention:
    backend: flashinfer_ssm
  compile_model:
    piecewise_enabled: true
  fuse_nvfp4_moe:
    backend: trtllm_gen
  mlir_elementwise_fusion:
    enabled: true
