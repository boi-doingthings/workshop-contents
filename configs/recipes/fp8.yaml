# ModelOpt 0.46.0rc0 PTQ recipe for W8A8 FP8 E4M3.
# KV-cache quantizers are intentionally absent, so the controlled comparison uses BF16 KV.
# Disabled entries combine ModelOpt 0.46's defaults with NVIDIA Nemotron-3 Nano 30B
# high-precision attention/Mamba exclusions. These selectors intentionally use the
# Transformers in-memory `model.layers` namespace observed in ModelOpt's quant summary,
# not the source/export checkpoint's `backbone.layers` namespace.
metadata:
  recipe_type: ptq
  description: W8A8 FP8 E4M3 max calibration with BF16 KV cache.
quantize:
  algorithm: max
  quant_cfg:
    - quantizer_name: '*'
      enable: false
    - quantizer_name: '*weight_quantizer'
      cfg:
        num_bits: e4m3
        axis: null
    - quantizer_name: '*input_quantizer'
      cfg:
        num_bits: e4m3
